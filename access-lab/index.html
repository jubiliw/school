nav .item{padding:11px;border-bottom:1px solid #eee;cursor:pointer;display:flex;gap:7px;align-items:center}.nav .item:hover,.nav .item.sel{background:#ffe5e9;color:#8b1732}.work{flex:1;min-width:0;padding:18px;overflow:auto}.welcome{max-width:940px;margin:20px auto;background:white;border-radius:15px;padding:32px;box-shadow:0 4px 18px #0001}.welcome h1{font-size:30px;color:var(--deep)}.welcome p{line-height:2}.action{background:var(--red);color:white;border:0;border-radius:7px;padding:10px 18px;font-weight:bold}.action:hover{background:var(--deep)}.secondary{background:#fff;color:var(--red);border:1px solid #bb7080;border-radius:7px;padding:9px 13px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.panel{background:white;border:1px solid #c9cdd3;box-shadow:0 2px 8px #0001}.panelhead{background:#f4f5f7;border-bottom:1px solid #ccc;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.panelbody{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field input,.field select,.field textarea{border:1px solid #c4cbd3;border-radius:5px;padding:9px;background:#fff;min-width:0}.field input:focus,.field select:focus{outline:2px solid #e9a1af}.tablewrap{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;background:white;min-width:600px}th,td{border:1px solid #d5d9de;padding:7px 8px;text-align:right;white-space:nowrap}th{background:#e5e8ed;font-weight:bold}td input,td select{width:100%;min-width:95px;padding:7px;border:1px solid transparent;background:transparent}td input:focus,td select:focus{border-color:var(--red);outline:0;background:#fff9fa}tr:nth-child(even) td{background:#f9fafb}.selected td{background:#ffe6eb!important}.props{background:#f7f8fa;padding:15px;border-top:1px solid #d0d0d0}.msg{padding:12px 16px;background:#fff4da;border:1px solid #edcb7a;border-radius:7px;margin:12px 0;line-height:1.8}.ok{background:#e5f6ea;border-color:#80c695}.status{background:#fff;border-top:1px solid #ccd1d8;padding:9px 16px;display:flex;justify-content:space-between;color:#5e6670}.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;margin:20px 0}.task{padding:15px;background:#fff5f6;border:1px solid #f0cbd2;border-radius:10px}.task b{color:#9e2340;display:block;margin-bottom:8px}.relation-area{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;padding:15px}.relation-box{min-width:190px;border:1px solid #b8bec9;background:white;box-shadow:0 2px 6px #0001}.relation-box b{display:block;background:#f3dbe1;padding:10px}.relation-box div{padding:7px 10px;border-top:1px solid #eee}.relation-link{background:#fff2f5;border:1px solid #e6bdc6;padding:13px;border-radius:7px;margin:10px 0}.modal-bg{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:20;padding:15px}.modal{width:min(560px,100%);background:white;border-radius:12px;box-shadow:0 20px 70px #0005;overflow:hidden}.modal header{background:var(--deep);color:white;padding:17px;font-weight:bold}.modal main{padding:20px;max-height:70vh;overflow:auto}.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:13px;border-top:1px solid #ddd}.form-card{max-width:570px;margin:auto;background:white;border:1px solid #c7cbd0;padding:24px;box-shadow:0 3px 12px #0001}.form-nav{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;flex-wrap:wrap}.form-nav button{padding:7px 12px;border:1px solid #ccc;background:#fff;border-radius:4px}.form-nav button:hover{background:#fce4e8}.tiny{color:#69727e;font-size:12px}.footercredit{color:#8b3146;font-weight:bold}@media(max-width:750px){.brand{padding:12px;min-height:68px}.brand strong{font-size:16px}.brand .pill{display:none}.shell{display:block}.nav{width:100%;max-height:115px;border-left:0;border-bottom:1px solid #ccc}.nav .items{display:flex;overflow-x:auto}.nav .item{white-space:nowrap}.work{padding:10px}.welcome{padding:18px;margin:5px}.welcome h1{font-size:22px}.group button{min-width:58px;padding:7px}.ribbon{min-height:94px}}@media print{.brand,.accessbar,.tabs,.ribbon,.nav,.status,.toolbar{display:none!important}.shell{display:block}.work{padding:0}}
</style></head><body>
<div class="brand"><div><strong>◈ مختبر قواعد البيانات التفاعلي</strong><small>إعداد المعلم وسام عبدالله جبيلي</small></div><span class="pill">مختبر المهارات الرقمية • Microsoft Access</span></div>
<div class="accessbar"><div><span class="logo">A</span> <span id="dbtitle">قاعدة بيانات جديدة - Access</span></div><div>◉ محفوظ محليًا <span style="opacity:.6">　□　×</span></div></div>
<div class="tabs" id="tabs"><button data-tab="file">ملف</button><button data-tab="home" class="active">الشريط الرئيسي</button><button data-tab="create">إنشاء</button><button data-tab="external">بيانات خارجية</button><button data-tab="tools">أدوات قاعدة البيانات</button><button data-tab="design">تصميم</button></div>
<div class="ribbon" id="ribbon"></div>
<div class="shell"><aside class="nav"><h3>كافة عناصر Access</h3><div class="items" id="objects"></div></aside><main class="work" id="work"></main></div>
<div class="status"><span id="stat">جاهز</span><span class="footercredit">إعداد المعلم وسام عبدالله جبيلي</span></div><div id="overlay"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES=['نص مختصر','نص طويل','رقم','تاريخ/وقت','ترقيم تلقائي','نعم/لا'];
const defaultFields=(name)=>name==='بيانات الطلبة'?[{name:'رقم الطالب',type:'ترقيم تلقائي',pk:true},{name:'الاسم',type:'نص مختصر',required:true},{name:'اسم العائلة',type:'نص مختصر'},{name:'الصف الدراسي',type:'نص مختصر'},{name:'رقم الفصل',type:'رقم'}]:name==='المواد الدراسية'?[{name:'رقم المادة',type:'ترقيم تلقائي',pk:true},{name:'اسم المادة',type:'نص مختصر',required:true}]:[{name:'رقم الدرجة',type:'ترقيم تلقائي',pk:true},{name:'رقم الطالب',type:'رقم',required:true},{name:'رقم المادة',type:'رقم',required:true},{name:'درجة الفصل الدراسي الأول',type:'رقم'},{name:'درجة الفصل الدراسي الثاني',type:'رقم'}];
let db={name:'',tables:[],relationships:[],forms:[]},view='welcome',active='',tab='home',selectedRow=-1,selectedField=0,formPos=0,notice='',formWizard={};
try{const s=JSON.parse(localStorage.getItem('wesam-access-v1'));if(s&&s.tables)db=s}catch(e){}
function save(){localStorage.setItem('wesam-access-v1',JSON.stringify(db));$('dbtitle').textContent=(db.name||'قاعدة بيانات جديدة')+' - Access';$('stat').textContent='تم حفظ التغييرات محليًا • '+new Date().toLocaleTimeString('ar-SA')}
function msg(s){notice=s;$('stat').textContent=s}
function modal(title,content,ok,onOk){$('overlay').innerHTML='<div class="modal-bg"><div class="modal"><header>'+title+'</header><main>'+content+'</main><footer><button class="secondary" onclick="closeModal()">إلغاء</button><button class="action" id="modalok">'+(ok||'موافق')+'</button></footer></div></div>';$('modalok').onclick=onOk}
function closeModal(){$('overlay').innerHTML=''}
function selectTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderRibbon()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
const btn=(label,fn)=>'<button onclick="'+fn+'">'+label+'</button>';
function renderRibbon(){const groups={home:[['طرق العرض',[['▦ ورقة البيانات',"switchView('data')"],['▤ عرض التصميم',"switchView('design')"]]],['السجلات',[['＋ سجل جديد','addRecord()'],['▣ حفظ','saveAndRender()'],['✕ حذف سجل','deleteRecord()']]],['بحث',[['⌕ بحث','searchRecords()']]]],create:[['الجداول',[['▦ جدول جديد','createTable()']]],['النماذج',[['▣ معالج النماذج','startWizard()']]]],tools:[['العلاقات',[['↔ علاقات','showRelationships()'],['＋ إنشاء علاقة','newRelationship()']]],['إدارة',[['✓ فحص التكامل','checkIntegrity()']]]],design:[['تصميم الجدول',[['⚿ مفتاح أساسي','togglePK()'],['▣ حفظ','saveAndRender()'],['▦ ورقة البيانات',"switchView('data')"]]]],file:[['ملف',[['＋ قاعدة بيانات جديدة','newDatabase()'],['▣ حفظ','saveAndRender()'],['⇩ تصدير نسخة JSON','exportJSON()'],['⇩ تصدير CSV','exportCSV()'],['⎙ طباعة','window.print()']]]],external:[['البيانات',[['⇩ تصدير CSV','exportCSV()'],['⇩ تصدير نسخة','exportJSON()']]]]};
$('ribbon').innerHTML=(groups[tab]||groups.home).map(g=>'<div class="group" data-label="'+g[0]+'">'+g[1].map(x=>btn(x[0],x[1])).join('')+'</div>').join('')}
function renderObjects(){$('objects').innerHTML=(db.tables.length?'<div class="tiny" style="padding:8px">الجداول</div>':'')+db.tables.map(t=>'<div class="item '+(active===t.name?'sel':'')+'" onclick="openTable(\''+esc(t.name)+'\')">▦ '+esc(t.name)+'</div>').join('')+(db.forms.length?'<div class="tiny" style="padding:8px">النماذج</div>':'')+db.forms.map(f=>'<div class="item '+(view==='form'&&active===f.name?'sel':'')+'" onclick="openForm(\''+esc(f.name)+'\')">▤ '+esc(f.name)+'</div>').join('')}
function render(){save();renderRibbon();renderObjects();if(view==='welcome')renderWelcome();else if(view==='design')renderDesign();else if(view==='data')renderData();else if(view==='relationships')renderRelationships();else if(view==='form')renderForm();else if(view==='wizard')renderWizard()}
function renderWelcome(){$('work').innerHTML='<div class="welcome"><div class="tiny">مختبر المهارات الرقمية | محاكاة تعليمية لبرنامج Microsoft Access</div><h1>مرحبًا بك في مختبر قواعد البيانات</h1><p>تعلّم عمليًا إنشاء قاعدة بيانات للطلبة، وتصميم الجداول والحقول، وتحديد المفتاح الأساسي، وإدخال السجلات، وربط الجداول، وإنشاء النماذج. جميع الأزرار الرئيسية تنفّذ عمليات فعلية داخل المحاكاة.</p><div class="toolbar"><button class="action" onclick="newDatabase()">＋ إنشاء قاعدة بيانات</button><button class="secondary" onclick="createTable()">＋ إنشاء جدول</button><button class="secondary" onclick="showRelationships()">↔ العلاقات</button></div><div class="tasks">'+[['1','إنشاء قاعدة بيانات فارغة'],['2','تصميم حقول الجداول وأنواع البيانات'],['3','تعيين مطلوب ومفتاح أساسي'],['4','إدخال السجلات وتعديلها وحذفها'],['5','إنشاء العلاقات والتكامل المرجعي'],['6','معالج النماذج وإدارة السجلات']].map(x=>'<div class="task"><b>المهمة '+x[0]+'</b>'+x[1]+'</div>').join('')+'</div><div class="msg">التطبيق محفوظ تلقائيًا على هذا المتصفح. استخدم «ملف ← تصدير نسخة JSON» للاحتفاظ بنسخة من مشروعك.</div></div>'}
function newDatabase(){modal('إنشاء قاعدة بيانات فارغة','<div class="field"><label>اسم قاعدة البيانات</label><input id="dbname" value="'+esc(db.name||'عينة 1')+'"></div><p class="tiny">سيتم إنشاء مشروع جديد. لا تنس تصدير نسخة من مشروعك الحالي قبل استبداله.</p>','إنشاء',()=>{let n=$('dbname').value.trim();if(!n)return alert('أدخل اسم قاعدة البيانات');db={name:n,tables:[],relationships:[],forms:[]};active='';view='welcome';closeModal();render();msg('تم إنشاء قاعدة البيانات: '+n)})}
function createTable(){if(!db.name)return newDatabase();modal('إنشاء جدول جديد','<div class="field"><label>اسم الجدول</label><input id="newtable" placeholder="مثل: بيانات الطلبة"></div><p class="tiny">يمكنك البدء بأسماء الحقول المقترحة أو تعديلها بالكامل في عرض التصميم.</p>','إنشاء الجدول',()=>{let n=$('newtable').value.trim();if(!n)return alert('اكتب اسم الجدول');if(db.tables.some(t=>t.name===n))return alert('اسم الجدول مستخدم');db.tables.push({name:n,fields:defaultFields(n).map(f=>({...f,size:255,defaultValue:'',rule:'',description:''})),records:[],nextId:1});active=n;view='design';selectedField=0;closeModal();selectTab('design');render()})}
function table(){return db.tables.find(t=>t.name===active)}
function openTable(n){active=n;view='data';selectedRow=-1;selectTab('home');render()}
function switchView(v){if(!table())return alert('أنشئ جدولًا أولًا');view=v;selectTab(v==='design'?'design':'home');render()}
function renderDesign(){let t=table();if(!t)return renderWelcome();$('work').innerHTML='<div class="toolbar"><strong>▤ عرض التصميم — '+esc(t.name)+'</strong><button class="secondary" onclick="addField()">＋ إضافة حقل</button><button class="secondary" onclick="removeField()">حذف الحقل المحدد</button><button class="action" onclick="switchView(\'data\')">ورقة البيانات ←</button></div><div class="panel"><div class="panelhead">تصميم الجدول <span class="tiny">حدد أي صف لتعديل خصائص الحقل أسفل الجدول</span></div><div class="tablewrap"><table><thead><tr><th>🔑</th><th>اسم الحقل</th><th>نوع البيانات</th><th>الوصف</th></tr></thead><tbody>'+t.fields.map((f,i)=>'<tr class="'+(selectedField===i?'selected':'')+'" onclick="selectField('+i+')"><td>'+ (f.pk?'🔑':'')+'</td><td><input value="'+esc(f.name)+'" onchange="changeField('+i+',\'name\',this.value)"></td><td><select onchange="changeField('+i+',\'type\',this.value)">'+TYPES.map(v=>'<option '+(v===f.type?'selected':'')+'>'+v+'</option>').join('')+'</select></td><td><input value="'+esc(f.description||'')+'" onchange="changeField('+i+',\'description\',this.value)"></td></tr>').join('')+'</tbody></table></div><div id="fieldprops"></div></div>';renderFieldProps()}
function selectField(i){selectedField=i;renderDesign()}
function renderFieldProps(){let t=table(),f=t?.fields[selectedField];if(!f)return;$('fieldprops').innerHTML='<div class="props"><strong>خصائص الحقل — '+esc(f.name)+'</strong><div class="grid" style="margin-top:13px"><label class="field">حجم الحقل<input type="number" min="1" max="255" value="'+(f.size||255)+'" onchange="changeField('+selectedField+',\'size\',this.value)"></label><label class="field">القيمة الافتراضية<input value="'+esc(f.defaultValue||'')+'" onchange="changeField('+selectedField+',\'defaultValue\',this.value)"></label><label class="field">قاعدة التحقق من الصحة (مثال: >=50)<input value="'+esc(f.rule||'')+'" onchange="changeField('+selectedField+',\'rule\',this.value)"></label><label class="field">مطلوب<select onchange="changeField('+selectedField+',\'required\',this.value===\'نعم\')"><option '+(!f.required?'selected':'')+'>لا</option><option '+(f.required?'selected':'')+'>نعم</option></select></label></div><div class="toolbar" style="margin-top:12px"><button class="secondary" onclick="togglePK()">⚿ '+(f.pk?'إلغاء المفتاح الأساسي':'تعيين مفتاح أساسي')+'</button></div></div>'}
function changeField(i,k,v){let t=table(),f=t.fields[i];if(k==='name'){v=v.trim();if(!v)return alert('اسم الحقل مطلوب');if(t.fields.some((x,j)=>j!==i&&x.name===v))return alert('اسم حقل مكرر');let old=f.name;t.records.forEach(r=>{r[v]=r[old];delete r[old]});db.relationships.forEach(r=>{if(r.parent===t.name&&r.parentField===old)r.parentField=v;if(r.child===t.name&&r.childField===old)r.childField=v})}if(k==='type'&&t.records.length&&!confirm('تغيير نوع البيانات قد يؤثر في السجلات. متابعة؟'))return;f[k]=v;save();renderDesign()}
function addField(){let t=table();t.fields.push({name:'حقل جديد '+(t.fields.length+1),type:'نص مختصر',size:255,required:false});selectedField=t.fields.length-1;render()}
function removeField(){let t=table();if(t.fields.length===1)return alert('لا يمكن حذف جميع الحقول');let f=t.fields[selectedField];if(!confirm('حذف الحقل '+f.name+' وبياناته؟'))return;t.fields.splice(selectedField,1);t.records.forEach(r=>delete r[f.name]);selectedField=Math.max(0,selectedField-1);render()}
function togglePK(){let t=table();if(!t)return;let f=t.fields[selectedField];if(!f)return;if(!f.pk){if(t.records.some(r=>r[f.name]===''||r[f.name]==null))return alert('لا يمكن تعيين مفتاح أساسي لحقل يحوي قيمًا فارغة');if(new Set(t.records.map(r=>String(r[f.name]))).size!==t.records.length)return alert('المفتاح الأساسي يجب أن يحتوي قيمًا فريدة')}f.pk=!f.pk;render()}
function validate(t,row,index){for(let f of t.fields){let v=row[f.name];if(f.required||f.pk){if(v===''||v==null)return 'الحقل «'+f.name+'» مطلوب ولا يمكن تركه فارغًا'}if(f.type==='رقم'&&v!==''&&!Number.isFinite(Number(v)))return 'الحقل «'+f.name+'» يتطلب رقمًا';if(f.type==='نص مختصر'&&String(v??'').length>Number(f.size||255))return 'تجاوز الحد الأقصى لحجم الحقل «'+f.name+'»';if(f.rule&&v!==''&&v!=null){let m=String(f.rule).match(/^(>=|<=|>|<|=)\s*(-?\d+(?:\.\d+)?)$/);if(m){let a=Number(v),b=Number(m[2]),op=m[1];if(!({'>':a>b,'<':a<b,'>=':a>=b,'<=':a<=b,'=':a===b}[op]))return 'قيمة «'+f.name+'» تخالف قاعدة التحقق '+f.rule}}if(f.pk&&t.records.some((r,i)=>i!==index&&String(r[f.name])===String(v)))return 'قيمة المفتاح الأساسي «'+f.name+'» مكررة';for(let rel of db.relationships.filter(x=>x.child===t.name&&x.childField===f.name&&x.integrity)){if(v!==''&&v!=null){let parent=db.tables.find(x=>x.name===rel.parent);if(parent&&!parent.records.some(x=>String(x[rel.parentField])===String(v)))return 'التكامل المرجعي: القيمة '+v+' غير موجودة في جدول '+rel.parent}}}return ''}
function renderData(){let t=table();if(!t)return renderWelcome();$('work').innerHTML='<div class="toolbar"><strong>▦ ورقة البيانات — '+esc(t.name)+'</strong><button class="action" onclick="addRecord()">＋ سجل جديد</button><button class="secondary" onclick="deleteRecord()">✕ حذف السجل المحدد</button><button class="secondary" onclick="switchView(\'design\')">▤ عرض التصميم</button><button class="secondary" onclick="searchRecords()">⌕ بحث</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>◀</th>'+t.fields.map(f=>'<th>'+(f.pk?'🔑 ':'')+esc(f.name)+' <span class="tiny">('+esc(f.type)+')</span></th>').join('')+'</tr></thead><tbody>'+t.records.map((r,i)=>'<tr class="'+(selectedRow===i?'selected':'')+'"><td onclick="selectedRow='+i+';renderData()" style="cursor:pointer">'+(selectedRow===i?'▶':'○')+'</td>'+t.fields.map(f=>'<td>'+ (f.type==='نعم/لا'?'<select onchange="editCell('+i+',\''+esc(f.name)+'\',this.value)"><option '+(r[f.name]==='لا'?'selected':'')+'>لا</option><option '+(r[f.name]==='نعم'?'selected':'')+'>نعم</option></select>':'<input '+(f.type==='ترقيم تلقائي'?'readonly':'')+' value="'+esc(r[f.name])+'" onchange="editCell('+i+',\''+esc(f.name)+'\',this.value)">')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="panelbody tiny">عدد السجلات: '+t.records.length+' | انقر على ○ لتحديد سجل، ثم عدّل أي خلية مباشرة. يتم التحقق من نوع البيانات والحقول المطلوبة والمفاتيح.</div></div>'}
function addRecord(){let t=table();if(!t)return alert('افتح جدولًا');let r={};t.fields.forEach(f=>{r[f.name]=f.type==='ترقيم تلقائي'?t.nextId++:f.defaultValue|| (f.type==='نعم/لا'?'لا':'')});t.records.push(r);selectedRow=t.records.length-1;save();view='data';render();msg('أضيف سجل جديد. أكمل الحقول المطلوبة قبل المتابعة.')}
function editCell(i,k,v){let t=table(),old=t.records[i][k];t.records[i][k]=v;let err=validate(t,t.records[i],i);if(err&&!(err.includes('مطلوب ولا يمكن تركه فارغًا')&&t.records[i][k]!=='')){t.records[i][k]=old;alert(err)}render()}
function deleteRecord(){let t=table();if(!t||selectedRow<0||selectedRow>=t.records.length)return alert('حدد سجلًا أولًا');let rec=t.records[selectedRow];for(let rel of db.relationships.filter(x=>x.parent===t.name&&x.integrity)){let child=db.tables.find(x=>x.name===rel.child);if(child?.records.some(r=>String(r[rel.childField])===String(rec[rel.parentField])))return alert('لا يمكن حذف السجل: توجد سجلات مرتبطة في '+rel.child+' (التكامل المرجعي)')}if(!confirm('هل تريد حذف هذا السجل نهائيًا؟'))return;t.records.splice(selectedRow,1);selectedRow=-1;render()}
function searchRecords(){let t=table();if(!t)return;let q=prompt('اكتب النص أو الرقم المراد البحث عنه');if(q===null)return;let i=t.records.findIndex(r=>Object.values(r).some(v=>String(v).includes(q)));if(i<0)return alert('لا توجد نتيجة');selectedRow=i;view='data';render();msg('تم العثور على السجل رقم '+(i+1))}
function showRelationships(){view='relationships';selectTab('tools');render()}
function renderRelationships(){$('work').innerHTML='<div class="toolbar"><strong>↔ علاقات الجداول</strong><button class="action" onclick="newRelationship()">＋ إنشاء علاقة</button><button class="secondary" onclick="checkIntegrity()">✓ فحص التكامل المرجعي</button></div><div class="panel"><div class="panelhead">عرض العلاقات — Database Tools</div><div class="relation-area">'+db.tables.map(t=>'<div class="relation-box"><b>▦ '+esc(t.name)+'</b>'+t.fields.map(f=>'<div>'+(f.pk?'🔑 ':'')+esc(f.name)+'</div>').join('')+'</div>').join('')+'</div><div class="panelbody"><h3>العلاقات المنشأة</h3>'+(db.relationships.length?db.relationships.map((r,i)=>'<div class="relation-link"><b>'+esc(r.parent)+' ['+esc(r.parentField)+']</b> ⟵ 1 : ∞ ⟶ <b>'+esc(r.child)+' ['+esc(r.childField)+']</b><span class="tiny">　'+(r.integrity?'✓ فرض التكامل المرجعي':'دون فرض التكامل')+'</span> <button class="secondary" onclick="removeRelation('+i+')">حذف العلاقة</button></div>').join(''):'<p class="tiny">لم تُنشأ علاقات بعد. أنشئ جدول بيانات الطلبة والمواد الدراسية ودرجات الطلبة، ثم اربط الحقول المتوافقة.</p>')+'</div></div>'}
function newRelationship(){if(db.tables.length<2)return alert('أنشئ جدولين على الأقل');let options=db.tables.map(t=>'<option>'+esc(t.name)+'</option>').join('');modal('تحرير العلاقات — Edit Relationships','<div class="grid"><label class="field">الجدول الأساسي<select id="relParent" onchange="relFields()">'+options+'</select></label><label class="field">الحقل الأساسي<select id="relParentField"></select></label><label class="field">الجدول المرتبط<select id="relChild" onchange="relFields()">'+options+'</select></label><label class="field">الحقل المرتبط<select id="relChildField"></select></label></div><p><label><input type="checkbox" id="relIntegrity" checked> فرض التكامل المرجعي (Enforce Referential Integrity)</label></p><div class="msg">يجب أن تتوافق أنواع الحقول، وأن تكون قيم الحقل المرتبط موجودة في الجدول الأساسي عند فرض التكامل المرجعي.</div>','إنشاء',()=>{let p=$('relParent').value,pf=$('relParentField').value,c=$('relChild').value,cf=$('relChildField').value,integrity=$('relIntegrity').checked;if(p===c)return alert('اختر جدولين مختلفين');let a=db.tables.find(t=>t.name===p),b=db.tables.find(t=>t.name===c),fa=a.fields.find(f=>f.name===pf),fb=b.fields.find(f=>f.name===cf);if(!(fa.type===fb.type||(fa.type==='ترقيم تلقائي'&&fb.type==='رقم')))return alert('نوعا الحقلين غير متوافقين');if(!fa.pk)return alert('يجب أن يكون الحقل في الجدول الأساسي مفتاحًا أساسيًا');if(integrity&&b.records.some(r=>r[cf]!==''&&r[cf]!=null&&!a.records.some(x=>String(x[pf])===String(r[cf]))))return alert('توجد سجلات تخالف التكامل المرجعي');if(db.relationships.some(r=>r.parent===p&&r.child===c&&r.parentField===pf&&r.childField===cf))return alert('العلاقة موجودة');db.relationships.push({parent:p,parentField:pf,child:c,childField:cf,integrity});closeModal();render()});$('relChild').selectedIndex=1;relFields()}
function relFields(){for(let [id,field] of [['relParent','relParentField'],['relChild','relChildField']]){let t=db.tables.find(x=>x.name===$(id).value);$(field).innerHTML=(t?.fields||[]).map(f=>'<option '+(f.pk&&id==='relParent'?'selected':'')+'>'+esc(f.name)+'</option>').join('')}}
function removeRelation(i){if(confirm('حذف العلاقة؟')){db.relationships.splice(i,1);render()}}
function checkIntegrity(){let bad=[];for(let r of db.relationships.filter(x=>x.integrity)){let a=db.tables.find(t=>t.name===r.parent),b=db.tables.find(t=>t.name===r.child);for(let rec of b?.records||[]){let v=rec[r.childField];if(v!==''&&v!=null&&!a?.records.some(x=>String(x[r.parentField])===String(v)))bad.push(r.child+' : '+v)}}alert(bad.length?'مخالفات التكامل المرجعي:\n'+bad.join('\n'):'✓ لا توجد مخالفات للتكامل المرجعي')}
function startWizard(){if(!db.tables.length)return alert('أنشئ جدولًا أولًا');formWizard={table:db.tables[0].name,fields:[],name:'نموذج للتعامل مع بيانات طالب',layout:'عمودي'};view='wizard';selectTab('create');render()}
function renderWizard(){let t=db.tables.find(x=>x.name===formWizard.table);$('work').innerHTML='<div class="panel" style="max-width:740px;margin:auto"><div class="panelhead"><b>معالج النماذج — Form Wizard</b><span>إنشاء ← معالج النماذج</span></div><div class="panelbody"><div class="grid"><label class="field">الجداول / الاستعلامات<select id="wtable" onchange="formWizard.table=this.value;formWizard.fields=[];renderWizard()">'+db.tables.map(x=>'<option '+(x.name===formWizard.table?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><label class="field">اسم النموذج<input id="wname" value="'+esc(formWizard.name)+'" oninput="formWizard.name=this.value"></label><label class="field">التخطيط<select id="wlayout" onchange="formWizard.layout=this.value"><option>عمودي</option><option>جدولي</option></select></label></div><h3>اختيار الحقول</h3><div class="toolbar"><button class="secondary" onclick="formWizard.fields='+JSON.stringify(t.fields.map(f=>f.name)).replace(/"/g,'&quot;')+';renderWizard()">≫ إضافة جميع الحقول</button><button class="secondary" onclick="formWizard.fields=[];renderWizard()">≪ إزالة الجميع</button></div><div class="grid">'+t.fields.map(f=>'<label><input type="checkbox" '+(formWizard.fields.includes(f.name)?'checked':'')+' onchange="wizardToggle(\''+esc(f.name)+'\',this.checked)"> '+esc(f.name)+'</label>').join('')+'</div><p class="tiny">الحقول المختارة: '+formWizard.fields.map(esc).join('، ')+'</p><div class="toolbar"><button class="action" onclick="finishWizard()">إنهاء — فتح النموذج</button></div></div></div>'}
function wizardToggle(f,on){formWizard.fields=on?[...formWizard.fields,f]:formWizard.fields.filter(x=>x!==f);save()}
function finishWizard(){let n=formWizard.name.trim();if(!n)return alert('أدخل اسم النموذج');if(!formWizard.fields.length)return alert('اختر حقلًا واحدًا على الأقل');if(db.forms.some(x=>x.name===n))return alert('اسم النموذج موجود');db.forms.push({...formWizard,name:n});active=n;view='form';formPos=0;render()}
function openForm(n){active=n;view='form';formPos=0;selectTab('home');render()}
function renderForm(){let f=db.forms.find(x=>x.name===active);if(!f)return renderWelcome();let t=db.tables.find(x=>x.name===f.table);if(!t)return renderWelcome();let row=t.records[formPos]||{},count=t.records.length;$('work').innerHTML='<div class="toolbar"><strong>▤ '+esc(f.name)+'</strong><button class="action" onclick="formNew()">＋ سجل جديد</button><button class="secondary" onclick="formSave()">▣ حفظ السجل</button><button class="secondary" onclick="formDelete()">✕ حذف</button><button class="secondary" onclick="openTable(\''+esc(t.name)+'\')">▦ عرض الجدول</button></div><div class="form-card"><h2 style="color:var(--red);border-bottom:2px solid #f1c4cd;padding-bottom:12px">'+esc(f.name)+'</h2><div class="grid" style="grid-template-columns:1fr">'+f.fields.map(k=>{let fld=t.fields.find(x=>x.name===k);return '<label class="field">'+esc(k)+(fld?.required?' *':'')+'<input data-formfield="'+esc(k)+'" '+(fld?.type==='ترقيم تلقائي'?'readonly':'')+' value="'+esc(row[k]??'')+'"></label>'}).join('')+'</div><div class="form-nav"><button onclick="formGo(0)">|◀</button><button onclick="formGo('+Math.max(0,formPos-1)+')">◀</button><span>السجل '+(count?formPos+1:0)+' من '+count+'</span><button onclick="formGo('+Math.min(count-1,formPos+1)+')">▶</button><button onclick="formGo('+Math.max(0,count-1)+')">▶|</button><button onclick="formNew()">＋</button></div></div>'}
function formSave(){let f=db.forms.find(x=>x.name===active),t=db.tables.find(x=>x.name===f.table),r=t.records[formPos];if(!r)return alert('أنشئ سجلًا أولًا');let copy={...r};document.querySelectorAll('[data-formfield]').forEach(el=>copy[el.dataset.formfield]=el.value);let err=validate(t,copy,formPos);if(err)return alert(err);Object.assign(r,copy);render();msg('تم حفظ السجل')}
function formGo(i){formSaveIfValid();formPos=Math.max(0,i);renderForm()}
function formSaveIfValid(){let f=db.forms.find(x=>x.name===active),t=db.tables.find(x=>x.name===f.table),r=t.records[formPos];if(!r)return;let copy={...r};document.querySelectorAll('[data-formfield]').forEach(el=>copy[el.dataset.formfield]=el.value);if(!validate(t,copy,formPos))Object.assign(r,copy);save()}
function formNew(){let f=db.forms.find(x=>x.name===active);active=f.table;addRecord();formPos=table().records.length-1;active=f.name;view='form';render()}
function formDelete(){let f=db.forms.find(x=>x.name===active);active=f.table;selectedRow=formPos;let count=table().records.length;deleteRecord();active=f.name;view='form';formPos=Math.min(formPos,Math.max(0,count-2));render()}
function saveAndRender(){save();msg('✓ تم حفظ المشروع');render()}
function exportJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'});download(blob,(db.name||'database')+'.json')}
function exportCSV(){let t=table()||db.tables[0];if(!t)return alert('لا توجد جداول للتصدير');let csv='\ufeff'+t.fields.map(f=>'"'+f.name.replace(/"/g,'""')+'"').join(',')+'\n'+t.records.map(r=>t.fields.map(f=>'"'+String(r[f.name]??'').replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),t.name+'.csv')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
