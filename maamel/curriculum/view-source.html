<script>
const notes = JSON.parse(document.querySelector('#notes').textContent)
const source = document.querySelector('#source'), page = document.querySelector('#pg')
const message = document.querySelector('#message'), link = document.querySelector('#open')
let resource, ticket = 0
function jump() {
  if (!page.reportValidity() || !Number.isInteger(page.valueAsNumber)) return
  document.querySelector('#note').textContent = notes[page.valueAsNumber - 1]
  if (!resource) return
  link.href = resource + '#page=' + page.valueAsNumber
  document.querySelector('iframe').src = link.href
  link.hidden = false
}
document.querySelector('#go').addEventListener('click',jump)
page.addEventListener('change',jump)
source.addEventListener('change',async () => {
  const selected = source.files[0], current = ++ticket
  if (resource) URL.revokeObjectURL(resource)
  resource = null
  link.hidden = true
  document.querySelector('iframe').removeAttribute('src')
  if (!selected) return
  try {
    message.textContent = 'تجري مطابقة الملف…'
    const hash = await crypto.subtle.digest('SHA-256',await selected.arrayBuffer())
    if (current !== ticket) return
    const hex = Array.from(new Uint8Array(hash),n=>n.toString(16).padStart(2,'0')).join('')
    if (hex !== '2190b1c54f441e7b4d19152cebb6d32c30848afc5666ccf22bb8a686acbd0319') {
      message.textContent = 'بصمة هذا الملف تختلف عن نسخة المراجعة.'; return
    }
    resource = URL.createObjectURL(selected)
    message.textContent = 'طابقت البصمة نسخة المراجعة.'
    jump()
  } catch { if (current === ticket) message.textContent = 'تعذرت قراءة الملف أو حساب بصمته في هذا المتصفح.' }
})
jump()
</script></html>
